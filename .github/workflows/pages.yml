name: pages

# Publish the docs site to GitHub Pages: the landing page plus the three
# hand-written design documents (architecture, wire contract, process
# contract), each rendered as a standalone page with `rustdoc`'s Markdown mode.
#
# The generated rustdoc for the crate is deliberately NOT published. quipu is a
# binary crate, so `cargo doc` documents every private item and its full doc
# comment; that is useful locally (`just docs`) but too much for a visitor.
#
# Manual trigger only: run it from the Actions tab (Settings → Pages → Source
# must be "GitHub Actions"). It never runs on pull_request, so a fork PR cannot
# deploy.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. `cancel-in-progress: false` so a queued deploy of a newer
# commit does not kill an in-flight one mid-upload and leave the site half-written.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Standalone Markdown → HTML. No crate is compiled; rustdoc only renders
      # the three files, links docs/assets/page.css from each page and puts the
      # back-link from docs/assets/page-header.html above the content.
      - name: build site
        run: |
          mkdir -p site
          cp docs/assets/landing.html site/index.html
          cp docs/assets/page.css site/page.css
          for doc in architecture wire-contract process-contract; do
            rustdoc "docs/$doc.md" -o site --markdown-css page.css \
              --html-before-content docs/assets/page-header.html
          done
          # rustdoc's Markdown mode prefixes every heading with "0.1", "0.2.1"…;
          # the documents number their own sections, so strip the generated ones.
          sed -i -E 's#(</a>)[0-9]+(\.[0-9]+)+ #\1#g; s#(title="[^"]*">)[0-9]+(\.[0-9]+)+ #\1#g' site/architecture.html site/wire-contract.html site/process-contract.html

      - name: check site
        run: |
          for f in index architecture wire-contract process-contract; do
            test -s "site/$f.html"
          done
          grep -qF 'no longer maintained' site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
