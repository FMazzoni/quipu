[package]
name = "quipu"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Structured, observable task substrate for agent orchestration"
license = "MIT"
repository = "https://github.com/FMazzoni/quipu"
readme = "README.md"

[[bin]]
name = "qp"
path = "src/main.rs"

[dependencies]
anyhow = "1"
thiserror = "1"
clap = { version = "4.5", features = ["derive", "env"] }
# Solely for `signal(SIGPIPE, SIG_DFL)` in main.rs (QP-139). Not a new
# dependency in any measurable sense: uuid -> getrandom -> libc already links it
# into the release binary, so naming it directly adds zero crates and zero
# bytes — `cargo tree -i libc` shows the pre-existing path. The alternative was
# a hand-rolled `extern "C"` block, which trades this line for hardcoded
# per-platform signal numbers.
libc = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
# The object-store ledger, and the two crates it takes. Both are SYNCHRONOUS:
# `ureq` is a blocking HTTP client and `rusty-s3` is a pure SigV4 signer that
# performs no I/O of its own, so the no-async-runtime rule is satisfied without
# contortion. `aws-sdk-s3` was rejected — it requires tokio, and `qp` is invoked
# hundreds of times per session where cold start is what costs. Shelling out to
# `curl`/`aws`/`mc` was rejected too: a system binary is an undeclared runtime
# dependency that varies per machine.
#
# Features are pared to what the ledger uses. `ureq` drops `gzip` (batches are
# already small JSONL and a ledger GET is not worth flate2). `rusty-s3` keeps
# only `rustcrypto` (HMAC/SHA-256 for signing) and `xml` (ListObjectsV2 response
# parsing); its `full` feature pulls serde_json and md-5 for actions quipu never
# issues — there is no DELETE and no multipart here.
ureq = { version = "3", default-features = false, features = ["rustls"] }
rusty-s3 = { version = "0.10", default-features = false, features = [
    "rustcrypto",
    "xml",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
uuid = { version = "1", features = ["v4"] }
# NOT a second datetime crate, and not a preference. `jiff` is an unconditional
# (non-optional) dependency of `rusty-s3` and appears in its PUBLIC API:
# `S3Action::sign_with_time(&self, Duration, &jiff::Timestamp)` is the only way
# to sign at a fixed instant, which is what pins the published AWS vectors
# against the exact call the client makes. `url::Url` is the same story — it is
# what `Bucket::new` takes and what signing returns. Measured: declaring both
# here adds ZERO crates to `cargo tree` (they are already in it via rusty-s3);
# it only makes `use jiff::…` legal in `src/s3.rs` instead of reaching through a
# re-export that rusty-s3 does not offer. This is the same situation as `libc`
# above.
#
# So do not try to unify `jiff` with the `time` crate below: `time` is quipu's
# own RFC 3339 stamping (`src/time.rs`), `jiff` is the signer's instant type,
# and dropping the direct declaration would remove a line from this file and
# nothing from the binary. `jiff` drops its timezone database — signing needs a
# UTC instant and nothing else.
jiff = { version = "0.2", default-features = false, features = ["std"] }
url = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

# Warn locally so `cargo build` stays quiet and fast; `just lint` and CI
# promote these to -D warnings. Deliberately NOT pedantic/nursery: this is a
# terse SQL-adjacent CLI and pedantic fights the intentional style rather than
# catching bugs.
[lints.rust]
unused = "warn"

[lints.clippy]
all = "warn"

# There is deliberately NO [lints.rustdoc] table. Evaluated and rejected (QP-138).
# The rustdoc gate stays as `cargo rustdoc -- -D warnings` in the justfile and CI.
#
# `[lints.rustdoc] all = "deny"` looks like it removes flag plumbing, but:
#
# 1. It does not remove the plumbing that matters. The `--html-after-content`
#    injection in .cargo/config.toml has to stay either way — that is the fragile
#    part. All this would drop is `-- -D warnings` from one recipe.
# 2. `rustdoc::all` is broader than `-D warnings`. It pulls in three
#    allow-by-default lints — unescaped-backticks, missing-crate-level-docs,
#    private-doc-tests — that the current gate does not enforce. Measured:
#    a single stray backtick in a `//!` header is exit 0 under the gate and a
#    hard error under all = "deny", and it reports the span of an unrelated
#    earlier line. private-doc-tests is a live hazard on a bin-only crate where
#    cargo passes --document-private-items and every item is private.
# 3. It denies for a plain developer `cargo doc` too (measured: exit 101).
#    That breaks the convention stated above — warn locally, deny in the gate —
#    for rustdoc alone, so iterating on docs means hard errors rather than
#    warnings.
#
# If you want this anyway, name the individual lints rather than the `all` group,
# and keep them at "warn" so the gate stays the single place that denies.

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
